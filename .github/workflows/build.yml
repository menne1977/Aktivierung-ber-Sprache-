name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprachmodell in die APK packen
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
          unzip -q model.zip -d app/src/main/assets
          rm model.zip
          ls app/src/main/assets/vosk-model-small-de-0.15

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DTM-Voice-apk
          path: app/build/outputs/apk/release/*.apk
